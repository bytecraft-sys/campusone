version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusone
      POSTGRES_PASSWORD: campusone_secret
      POSTGRES_DB: campusone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusone -d campusone_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: campusone-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: campusone-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://campusone:campusone_secret@postgres:5432/campusone_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_KEY: minioadmin
      STORAGE_SECRET: minioadmin
    ports:
      - "8000:8000"

  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
    container_name: campusone-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:

